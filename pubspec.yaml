name: horizontal_credit_card
description: A modern, customizable horizontal credit and debit card UI widget for Flutter with 3D flip, metallic, glassmorphic, and frozen card states.
version: 0.0.1
homepage: https://github.com/ClevesDev/horizontal_credit_card
repository: https://github.com/ClevesDev/horizontal_credit_card
issue_tracker: https://github.com/ClevesDev/horizontal_credit_card/issues

topics:
  - credit-card
  - fintech
  - horizontal-card
  - card-wallet
  - wallet

screenshots:
  - description: '3D horizontal credit card UI widget showcase with realistic textures for Flutter.'
    path: doc/screenshots/horizontal_credit_card_banner.jpg
  - description: 'Curated library of horizontal payment card presets and physical finishes.'
    path: doc/screenshots/horizontal_cards_lineup.jpg
  - description: '3D physical thickness and letterpress embossed typography with specular glare reflection.'
    path: doc/images/Animation1.gif
  - description: 'Solid Cobalt Blue card with vertical holographic rainbow security stripe.'
    path: doc/images/Animation2.gif
  - description: 'Platinum Elite card with vertical security hologram ribbon.'
    path: doc/images/Animation3.gif
  - description: 'Security hologram badge, masked digits, and instant copy-to-clipboard button.'
    path: doc/images/Animation4.gif

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
